[project]
name = "bloxorz-solver"
version = "0.1.0"
description = "Bloxorz puzzle game with a Pygame interface and reusable search contracts"
readme = "README.md"
authors = [
    { name = "Tien-Son Nguyen", email = "ntson.1303@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6.1",
]

[project.scripts]
bloxorz-solver = "bloxorz_solver:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
